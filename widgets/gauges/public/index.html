<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; color: var(--homey-text-color, #222); font-family: var(--homey-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif); }
    .panel-title { font-size: var(--homey-font-size-small, 14px); font-weight: 600; margin: 0 0 2px 2px; }
    .grid { display: grid; gap: 2px 6px; }
    .gauge { display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .gauge svg { width: 100%; height: auto; display: block; }
    .gauge-title { font-size: 11px; opacity: 0.7; margin-top: -1px; max-width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
    .size-S .gauge-title { font-size: 10px; }
    .size-L .gauge-title { font-size: 12px; }
    .message { font-size: 13px; opacity: 0.75; padding: 8px 2px; line-height: 1.4; }
  </style>
</head>
<body class="homey-widget-small">
  <div id="root"></div>
  <script src="gauge.js"></script>
  <script>
    // Minimum gauge width per size, used by the "Automatic" column setting
    var MIN_WIDTH = { S: 70, M: 96, L: 130 };
    var state = { panel: null, values: {}, settings: {}, ready: false, lastHeight: 0 };

    function key(g) { return g.deviceId + '|' + g.capability; }

    function columns(count) {
      var s = state.settings;
      if (s.columns && s.columns !== 'auto') return Math.min(Number(s.columns), Math.max(1, count));
      var width = document.getElementById('root').clientWidth || window.innerWidth;
      var fit = Math.floor((width + 6) / ((MIN_WIDTH[s.size] || MIN_WIDTH.M) + 6));
      return Math.max(1, Math.min(fit, count, 6));
    }

    function message(text) {
      document.getElementById('root').innerHTML = '<div class="message">' + CompactGauge.esc(text) + '</div>';
      finish();
    }

    function render() {
      var p = state.panel;
      if (!p) return;
      var gauges = p.gauges || [];
      if (!gauges.length) return message(Homey.__('emptyPanel'));
      var root = document.getElementById('root');
      var html = '';
      if (state.settings.show_title !== false) html += '<div class="panel-title">' + CompactGauge.esc(p.name) + '</div>';
      html += '<div class="grid size-' + (state.settings.size || 'M') + '" style="grid-template-columns:repeat(' + columns(gauges.length) + ',minmax(0,1fr))">';
      gauges.forEach(function (g, i) {
        html += '<div class="gauge" id="g' + i + '">' + CompactGauge.svg(g, state.values[key(g)])
          + '<span class="gauge-title">' + CompactGauge.esc(g.title) + '</span></div>';
      });
      html += '</div>';
      root.innerHTML = html;
      finish();
    }

    // Only redraw the gauges whose value changed
    function update(batch) {
      if (!state.panel) return;
      (state.panel.gauges || []).forEach(function (g, i) {
        var k = key(g);
        if (!(k in batch)) return;
        state.values[k] = batch[k];
        var el = document.getElementById('g' + i);
        if (el) el.firstChild.outerHTML = CompactGauge.svg(g, batch[k]);
      });
    }

    function finish() {
      var height = Math.ceil(document.body.scrollHeight);
      if (!state.ready) {
        state.ready = true;
        state.lastHeight = height;
        Homey.ready({ height: height });
      } else if (Math.abs(height - state.lastHeight) > 1) {
        state.lastHeight = height;
        Homey.setHeight(height);
      }
    }

    function onHomeyReady(Homey) {
      state.settings = Homey.getSettings() || {};
      var panel = state.settings.panel;
      if (!panel || !panel.id) return message(Homey.__('choosePanel'));

      Homey.on('values', update);

      Homey.api('GET', '/panel?id=' + encodeURIComponent(panel.id))
        .then(function (data) {
          if (!data) return message(Homey.__('panelMissing'));
          state.panel = data;
          state.values = data.values || {};
          render();
          // re-layout when the widget width changes (rotation, other screen)
          var lastWidth = document.getElementById('root').clientWidth;
          window.addEventListener('resize', function () {
            var w = document.getElementById('root').clientWidth;
            if (w !== lastWidth) { lastWidth = w; render(); }
          });
        })
        .catch(function (err) {
          message(String(err && err.message ? err.message : err));
        });
    }
  </script>
</body>
</html>
