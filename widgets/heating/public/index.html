<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; color: var(--homey-text-color, #222);
      font-family: var(--homey-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .title { font-size: 14px; font-weight: 600; margin: 0 0 4px 2px; }
    .grid { display: grid; gap: 6px; --big: 24px; --name: 13px; --val: 13px; }
    .grid.size-S { --big: 20px; --name: 12px; --val: 12px; }
    .grid.size-L { --big: 30px; --name: 14px; --val: 15px; }
    .card { min-width: 0; padding: 8px 10px 9px; border-radius: 12px; background: rgba(127,127,127,.12); cursor: pointer; }
    .card.na { opacity: .5; }
    .head { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .head svg { flex: none; width: 22px; height: 22px; }
    .name { flex: 1; min-width: 0; font-size: var(--name); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip { flex: none; font-size: 11px; font-weight: 600; padding: 2px 6px 2px 4px; border-radius: 9px; background: rgba(127,127,127,.18);
      display: flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
    .chip svg { width: 16px; height: 16px; }
    .main { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 4px; }
    .big { font-size: var(--big); font-weight: 650; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .big small { font-size: .55em; font-weight: 600; margin-left: 2px; opacity: .8; }
    .side { text-align: right; min-width: 0; }
    .side .l { font-size: 10.5px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side .v { font-size: var(--val); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bat { position: relative; height: 8px; border-radius: 4px; background: rgba(127,127,127,.22); margin-top: 7px; overflow: hidden; }
    .bat i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
    .curve { display: block; width: 100%; height: 34px; margin-top: 7px; overflow: visible; }
    .curve-meta { display: flex; justify-content: space-between; font-size: 10px; opacity: .55; margin-top: 1px; font-variant-numeric: tabular-nums; }
    .stats { display: grid; grid-template-columns: repeat(var(--sc, 2), minmax(0, 1fr)); gap: 5px 10px; margin-top: 8px; }
    .stat { min-width: 0; }
    .stat .l { font-size: 10.5px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .v { font-size: var(--val); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .edit { margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(127,127,127,.25); cursor: default; }
    .edit .hint { font-size: 11px; opacity: .7; margin-bottom: 6px; }
    .opts { display: flex; flex-wrap: wrap; gap: 5px; }
    .opt { font-size: 12px; padding: 6px 9px; border-radius: 14px; background: rgba(127,127,127,.18); cursor: pointer; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opt span { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .opt.sel { background: #3a7bd5; color: #fff; }
    .opt.sel span { opacity: .85; }
    .opt b { display: inline-block; min-width: 14px; font-size: 10px; margin-right: 3px; }
    .actions { display: flex; gap: 6px; margin-top: 8px; }
    .actions button { flex: 1; height: 36px; border: none; border-radius: 10px; background: rgba(127,127,127,.2); color: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .actions button.primary { background: #3a7bd5; color: #fff; }
    .tgt { display: flex; align-items: center; gap: 4px; margin-top: 3px; }
    .tgt button { width: 34px; height: 30px; border: none; border-radius: 9px; background: rgba(127,127,127,.2); color: inherit;
      font-size: 18px; font-weight: 600; line-height: 1; cursor: pointer; }
    .tgt button:active { background: rgba(127,127,127,.38); }
    .tgt .t { min-width: 54px; text-align: center; font-size: var(--val); font-weight: 600; font-variant-numeric: tabular-nums; }
    .tgt .lbl { font-size: 10.5px; opacity: .65; margin-right: 2px; }
    .status { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; font-weight: 600; min-width: 0; }
    .status svg { flex: none; width: 15px; height: 15px; }
    .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alarm { background: rgba(224,67,63,.9); color: #fff; }
    .message { font-size: 13px; opacity: .75; padding: 8px 2px; line-height: 1.4; }
  </style>
</head>
<body class="homey-widget-small">
  <div id="root"></div>
  <script>
    var MIN_WIDTH = { S: 190, M: 220, L: 270 };
    var MAX_AUTO = 6;
    var ORANGE = '#e8702a', RED = '#e0433f', BLUE = '#3a7bd5', GREEN = '#3f9b2d';
    var state = { devices: [], settings: {}, fields: {}, history: {}, editing: null, draft: null, ready: false, lastHeight: 0, language: undefined, hold: {}, timers: {} };

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function dev(id) { return state.devices.find(function (d) { return d.id === id; }); }
    function cap(d, id) { return d.caps.find(function (c) { return c.id === id; }); }
    function loc(v, dec) {
      try { return Number(v).toLocaleString(state.language || undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
      catch (e) { return Number(v).toFixed(dec); }
    }
    function autoDec(v) { var a = Math.abs(v); return a >= 100 ? 0 : a >= 10 ? 1 : 2; }
    function fmtParts(c, v) {
      if (v === null || v === undefined || v === '') return ['–', ''];
      if (c.type === 'boolean') return [Homey.__(v ? 'on' : 'off'), ''];
      if (c.type !== 'number') {
        var e = (c.values || []).find(function (x) { return x.id === v; });
        return [e ? e.title : String(v), ''];
      }
      var n = Number(v);
      if (isNaN(n)) return ['–', ''];
      var u = c.units || '';
      if (u === 'W' && Math.abs(n) >= 1000) return [loc(n / 1000, 2), 'kW'];
      if (u === '°C' || u === '°F') return [loc(n, 1), u];
      if (/bar/i.test(u)) return [loc(n, 1), u];
      var dec = c.decimals !== null && c.decimals !== undefined ? Math.min(c.decimals, autoDec(n)) : autoDec(n);
      if (Number.isInteger(n) && (c.decimals === 0 || u === '%' || u === '')) dec = 0;
      return [loc(n, dec), u];
    }
    function fmt(c, v) { var p = fmtParts(c, v); return p[1] ? p[0] + (p[1] === '%' ? ' %' : ' ' + p[1]) : p[0]; }
    function deg(v) { return v === null || v === undefined || isNaN(Number(v)) ? '–' : loc(v, 1) + '°'; }

    // Boiler apps all name their values differently: recognise them by id, title and unit
    function text(c) { return (c.id + ' ' + c.title).toLowerCase(); }
    function isTemp(c) { return c.type === 'number' && (/^measure_temperature/.test(c.id) || c.units === '°C' || c.units === '°F'); }
    var ROLES = {
      room: function (c) { return c.id === 'measure_temperature'; },
      target: function (c) { return c.setable && /^target_temperature/.test(c.id); },
      flow: function (c) { return isTemp(c) && /flow|aanvoer|supply|vorlauf|ch_?water|boiler_?temp|ketel|heating_?water|cv_?temp|cv[ -]?water/.test(text(c)) && !/return|retour|target|setpoint|max/.test(text(c)); },
      ret: function (c) { return isTemp(c) && /return|retour|rücklauf/.test(text(c)); },
      outside: function (c) { return isTemp(c) && /outside|outdoor|buiten|exterieur|aussen/.test(text(c)); },
      dhw: function (c) { return isTemp(c) && /dhw|hot_?water|warm_?water|tap|sanitary|domestic|boiler water|ww/.test(text(c)) && !/target|setpoint/.test(text(c)); },
      pressure: function (c) { return c.type === 'number' && (/bar/i.test(c.units || '') || /pressure|druk/.test(text(c))); },
      modulation: function (c) { return c.type === 'number' && /modul/.test(text(c)); },
      burner: function (c) { return c.type === 'boolean' && /flame|burner|brander|vlam|heating_?active|ch_?active|central_?heating|cv_?actief|cv_?active/.test(text(c)); },
      hotwater: function (c) { return c.type === 'boolean' && /dhw|hot_?water|warm_?water|tapwater|sanitary/.test(text(c)); },
      gas: function (c) { return c.type === 'number' && (/m³|m3/i.test(c.units || '') || /gas/.test(text(c))); },
    };
    function find(d, role) { return d.caps.find(ROLES[role]) || null; }
    function alarms(d) { return d.caps.filter(function (c) { return c.type === 'boolean' && /^alarm_/.test(c.id) && c.value === true; }); }

    function excludeOf(d) {
      var ex = [];
      ['room', 'target', 'pressure', 'burner', 'hotwater'].forEach(function (r) { var c = find(d, r); if (c) ex.push(c.id); });
      var m = find(d, 'modulation'); if (m) ex.push(m.id);
      var f = find(d, 'flow'); if (f) ex.push(f.id);
      return ex;
    }

    function autoFields(d, exclude) {
      var out = [];
      ['flow', 'ret', 'dhw', 'outside', 'gas'].forEach(function (r) {
        var c = find(d, r);
        if (c && exclude.indexOf(c.id) < 0 && out.indexOf(c.id) < 0) out.push(c.id);
      });
      d.caps.forEach(function (c) {
        if (out.length >= MAX_AUTO || exclude.indexOf(c.id) >= 0 || out.indexOf(c.id) >= 0) return;
        if (c.type === 'number' && !c.setable && (/^measure_|^meter_/.test(c.id) || c.units)) out.push(c.id);
      });
      return out.slice(0, MAX_AUTO);
    }
    function shownFields(d, exclude) {
      var chosen = state.fields[d.id];
      if (chosen && chosen.length) return chosen.filter(function (id) { return cap(d, id); });
      return autoFields(d, exclude);
    }

    function columns(n) {
      var s = state.settings;
      if (s.columns && s.columns !== 'auto') return Math.min(Number(s.columns), Math.max(1, n));
      var width = document.getElementById('root').clientWidth || window.innerWidth;
      return Math.max(1, Math.min(Math.floor((width + 6) / ((MIN_WIDTH[s.size] || MIN_WIDTH.M) + 6)), n, 3));
    }

    var FLAME = '<path d="M12 2.5c.5 3.2 4.8 5.3 4.8 10.2a4.8 4.8 0 0 1-9.6 0c0-2.3 1.1-3.6 2.3-4.9.3 1.6 1 2.6 2 3 .1-3.2-.1-5.6.5-8.3z"/>';
    function svg(p, fill) { return '<svg viewBox="0 0 24 24" fill="' + (fill || 'none') + '" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">' + p + '</svg>'; }
    var ICON_BOILER = function (burning, colour) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">'
        + '<rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 18.5h8"/><circle cx="15.5" cy="5.6" r=".9" fill="currentColor"/>'
        + '<path d="M12 8c.3 1.6 2.4 2.6 2.4 5.1a2.4 2.4 0 0 1-4.8 0c0-1.2.6-1.8 1.2-2.5.1.8.5 1.3 1 1.5 0-1.6 0-2.8.2-4.1z" fill="' + (burning ? colour : 'none') + '" stroke="' + (burning ? colour : 'currentColor') + '"/></svg>';
    };
    var ICON_TAP = svg('<path d="M4 9h9a3 3 0 0 1 3 3v1M4 6v6M16 16c0 1.2-.8 2.5-1.5 3.5-.7-1-1.5-2.3-1.5-3.5a1.5 1.5 0 0 1 3 0z"/>');
    var ICON_IDLE = svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/>');
    var ICON_ALARM = svg('<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.3"/>');

    function pressureColour(p) { return p < 0.8 || p > 3 ? RED : p < 1.2 || p > 2.5 ? ORANGE : 'inherit'; }

    function curveHtml(d, idx, c) {
      var pts = state.history[d.id];
      if (state.settings.curve === false || !c || !pts || pts.length < 2) return '';
      var start = new Date(); start.setHours(0, 0, 0, 0);
      var t0 = start.getTime(), span = 24 * 3600 * 1000;
      var max = -Infinity, min = Infinity, peak = null;
      pts.forEach(function (p) { if (p[1] > max) max = p[1]; if (p[1] < min) min = p[1]; if (!peak || p[1] > peak[1]) peak = p; });
      min = Math.floor(min - 1); max = Math.ceil(max + 1);
      var H = 34, W = 240;
      var y = function (v) { return (H - ((v - min) / (max - min)) * H).toFixed(1); };
      var x = function (t) { return (Math.max(0, Math.min(1, (t - t0) / span)) * W).toFixed(1); };
      var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p[0]) + ' ' + y(p[1]); }).join('');
      var area = line + 'L' + x(pts[pts.length - 1][0]) + ' ' + H + 'L' + x(pts[0][0]) + ' ' + H + 'Z';
      var out = '<svg class="curve" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><path d="' + area + '" fill="' + ORANGE + '" fill-opacity=".2"/>'
        + '<path d="' + line + '" fill="none" stroke="' + ORANGE + '" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
      [6, 12, 18].forEach(function (h) { out += '<path d="M' + (W * h / 24) + ' ' + H + 'v-3" stroke="currentColor" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/>'; });
      var when = new Date(peak[0]);
      var hhmm = ('0' + when.getHours()).slice(-2) + ':' + ('0' + when.getMinutes()).slice(-2);
      var label = c === find(d, 'flow') ? Homey.__('flowToday') : Homey.__('today');
      return out + '</svg><div class="curve-meta"><span>' + esc(label) + '</span><span>' + esc(Homey.__('max')) + ' ' + esc(deg(peak[1])) + ' · ' + hhmm + '</span></div>';
    }

    function statsHtml(d, ids, cols) {
      if (!ids.length) return '';
      return '<div class="stats" style="--sc:' + cols + '">' + ids.map(function (id) {
        var c = cap(d, id);
        return '<div class="stat"><div class="l">' + esc(c.title) + '</div><div class="v">' + esc(fmt(c, c.value)) + '</div></div>';
      }).join('') + '</div>';
    }

    function editHtml(d, exclude) {
      var sel = state.draft;
      var auto = !sel.length;
      var current = auto ? autoFields(d, exclude) : sel;
      return '<div class="edit"><div class="hint">' + esc(Homey.__(auto ? 'fieldsHintAuto' : 'fieldsHint')) + '</div><div class="opts">'
        + d.caps.filter(function (c) { return exclude.indexOf(c.id) < 0 && !c.setable; }).map(function (c) {
          var i = current.indexOf(c.id);
          return '<span class="opt' + (i >= 0 ? ' sel' : '') + '" data-opt="' + esc(c.id) + '">' + (i >= 0 ? '<b>' + (i + 1) + '</b>' : '')
            + esc(c.title) + '<span>' + esc(fmt(c, c.value)) + '</span></span>';
        }).join('') + '</div>'
        + '<div class="actions"><button data-do="auto">' + esc(Homey.__('automatic')) + '</button><button class="primary" data-do="done">' + esc(Homey.__('done')) + '</button></div></div>';
    }

    function cardHtml(d, idx, width) {
      if (d.missing) return '<div class="card na"><div class="name">' + esc(Homey.__('missing')) + '</div></div>';
      var room = find(d, 'room'), target = find(d, 'target'), flow = find(d, 'flow'), pressure = find(d, 'pressure');
      var mod = find(d, 'modulation'), burner = find(d, 'burner'), hw = find(d, 'hotwater');
      var modVal = mod ? Number(mod.value) : null;
      var burning = (burner && burner.value === true) || (modVal !== null && modVal > 0);
      var al = alarms(d);
      var html = '<div class="card' + (d.available === false ? ' na' : '') + '" data-id="' + esc(d.id) + '">';
      html += '<div class="head">' + ICON_BOILER(burning, ORANGE) + '<span class="name">' + esc(d.name) + '</span>'
        + (al.length ? '<span class="chip alarm">' + esc(Homey.__('fault')) + '</span>' : '') + '</div>';

      var main = room || flow;
      html += '<div class="main"><span><span class="big">' + (main ? esc(deg(main.value)) : '–') + '</span>'
        + (main && main !== room ? '<div class="side" style="text-align:left"><div class="l">' + esc(main.title) + '</div></div>' : '');
      if (target) {
        html += '<div class="tgt"><span class="lbl">' + esc(Homey.__('target')) + '</span><button data-step="-1" data-cap="' + esc(target.id) + '">−</button>'
          + '<span class="t" data-t="' + esc(d.id) + '">' + esc(deg(target.value)) + '</span><button data-step="1" data-cap="' + esc(target.id) + '">+</button></div>';
      }
      html += '</span>';
      if (pressure) {
        var pv = Number(pressure.value);
        html += '<span class="side"><div class="l">' + esc(Homey.__('pressure')) + '</div><div class="v" style="color:' + (isNaN(pv) ? 'inherit' : pressureColour(pv)) + '">' + esc(fmt(pressure, pressure.value)) + '</div>'
          + (flow && main !== flow ? '<div class="l" style="margin-top:3px">' + esc(Homey.__('flow')) + '</div><div class="v">' + esc(deg(flow.value)) + '</div>' : '') + '</span>';
      } else if (flow && main !== flow) {
        html += '<span class="side"><div class="l">' + esc(Homey.__('flow')) + '</div><div class="v">' + esc(deg(flow.value)) + '</div></span>';
      }
      html += '</div>';

      var st;
      if (al.length) st = '<div class="status" style="color:' + RED + '">' + ICON_ALARM + '<span>' + esc(al.map(function (a) { return a.title; }).join(', ')) + '</span></div>';
      else if (hw && hw.value === true) st = '<div class="status" style="color:' + BLUE + '">' + ICON_TAP + '<span>' + esc(Homey.__('hotWater')) + (modVal ? ' · ' + loc(modVal, 0) + ' %' : '') + '</span></div>';
      else if (burning) st = '<div class="status" style="color:' + ORANGE + '">' + svg(FLAME, ORANGE) + '<span>' + esc(Homey.__('heating')) + (modVal ? ' · ' + esc(Homey.__('modulation')) + ' ' + loc(modVal, 0) + ' %' : '') + '</span></div>';
      else if (burner || mod) st = '<div class="status" style="opacity:.7">' + ICON_IDLE + '<span>' + esc(Homey.__('standby')) + '</span></div>';
      if (st) html += st;

      html += curveHtml(d, idx, curveCap(d));
      var exclude = excludeOf(d);
      if (state.editing === d.id) html += editHtml(d, exclude);
      else html += statsHtml(d, shownFields(d, exclude), width >= 330 ? 3 : 2);
      return html + '</div>';
    }

    function curveCap(d) { return find(d, 'flow') || find(d, 'room'); }

    function render() {
      var root = document.getElementById('root');
      if (!state.devices.length) {
        root.innerHTML = '<div class="message">' + esc(Homey.__('chooseBoiler')) + '</div>';
        return finish();
      }
      var cols = columns(state.devices.length);
      var width = root.clientWidth || window.innerWidth;
      var cardWidth = (width - 6 * (cols - 1)) / cols;
      var html = state.settings.title ? '<div class="title">' + esc(state.settings.title) + '</div>' : '';
      html += '<div class="grid size-' + (state.settings.size || 'M') + '" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">';
      state.devices.forEach(function (d, i) { html += cardHtml(d, i, cardWidth); });
      root.innerHTML = html + '</div>';
      finish();
    }

    function finish() {
      var height = Math.ceil(document.body.scrollHeight);
      if (!state.ready) { state.ready = true; state.lastHeight = height; Homey.ready({ height: height }); }
      else if (Math.abs(height - state.lastHeight) > 1) { state.lastHeight = height; Homey.setHeight(height); }
    }

    function stepTarget(d, c, dir) {
      var step = c.step || 0.5;
      var v = Math.round(((Number(c.value) || c.min) + dir * step) / step) * step;
      v = Math.max(c.min, Math.min(c.max, Number(v.toFixed(3))));
      c.value = v;
      state.hold[d.id + '|' + c.id] = Date.now() + 3000;
      var el = document.querySelector('[data-t="' + CSS.escape(d.id) + '"]');
      if (el) el.textContent = deg(v);
      clearTimeout(state.timers[d.id]);
      state.timers[d.id] = setTimeout(function () {
        state.hold[d.id + '|' + c.id] = Date.now() + 2000;
        Homey.api('POST', '/set', { deviceId: d.id, capability: c.id, value: v }).catch(function (err) { console.error(err); load(); });
      }, 800);
    }

    function onClick(e) {
      var card = e.target.closest('.card[data-id]');
      if (!card) return;
      var d = dev(card.getAttribute('data-id'));
      var stepBtn = e.target.closest('[data-step]');
      if (stepBtn) return stepTarget(d, cap(d, stepBtn.getAttribute('data-cap')), Number(stepBtn.getAttribute('data-step')));
      if (e.target.closest('.tgt')) return;
      var opt = e.target.closest('[data-opt]');
      var doBtn = e.target.closest('[data-do]');
      if (opt) {
        var id = opt.getAttribute('data-opt');
        if (!state.draft.length) state.draft = autoFields(d, excludeOf(d));
        var i = state.draft.indexOf(id);
        if (i >= 0) state.draft.splice(i, 1); else state.draft.push(id);
        return render();
      }
      if (doBtn) {
        if (doBtn.getAttribute('data-do') === 'auto') state.draft = [];
        var list = state.draft;
        if (list.length) state.fields[d.id] = list.slice(); else delete state.fields[d.id];
        Homey.api('POST', '/fields', { deviceId: d.id, fields: list }).catch(function (err) { console.error(err); });
        state.editing = null;
        return render();
      }
      if (e.target.closest('.edit')) return;
      if (state.editing === d.id) { state.editing = null; return render(); }
      state.editing = d.id;
      state.draft = (state.fields[d.id] || []).slice();
      render();
    }

    function onValues(batch) {
      var dirty = false;
      Object.keys(batch).forEach(function (k) {
        var i = k.indexOf('|');
        var d = dev(k.slice(0, i));
        if (!d) return;
        var c = cap(d, k.slice(i + 1));
        if (!c || (state.hold[k] && state.hold[k] > Date.now())) return;
        c.value = batch[k];
        dirty = true;
        var cc = curveCap(d);
        if (cc && cc.id === c.id && state.history[d.id]) {
          var pts = state.history[d.id], now = Date.now(), last = pts[pts.length - 1];
          if (last && now - last[0] < 60000) last[1] = Number(c.value); else pts.push([now, Number(c.value)]);
        }
      });
      if (dirty) render();
    }

    function loadHistory() {
      if (state.settings.curve === false) return;
      state.devices.forEach(function (d) {
        var c = !d.missing && curveCap(d);
        if (!c) return;
        Homey.api('GET', '/history?device=' + encodeURIComponent(d.id) + '&capability=' + encodeURIComponent(c.id))
          .then(function (pts) { if (Array.isArray(pts)) { state.history[d.id] = pts; render(); } })
          .catch(function () { /* no curve */ });
      });
    }

    function load() {
      var ids = Homey.getDeviceIds ? Homey.getDeviceIds() : [];
      if (!ids || !ids.length) { state.devices = []; return render(); }
      return Homey.api('GET', '/state?ids=' + encodeURIComponent(ids.join(',')))
        .then(function (data) {
          state.devices = (data && data.devices) || [];
          state.fields = (data && data.fields) || {};
          state.language = data && data.language;
          if (state.language) document.documentElement.lang = state.language;
          render();
          loadHistory();
        })
        .catch(function (err) {
          document.getElementById('root').innerHTML = '<div class="message">' + esc(err && err.message ? err.message : err) + '</div>';
          finish();
        });
    }

    function onHomeyReady(Homey) {
      state.settings = Homey.getSettings() || {};
      var root = document.getElementById('root');
      root.addEventListener('click', onClick);
      Homey.on('values', onValues);
      Homey.on('fields', function (f) { state.fields = f || {}; if (!state.editing) render(); });
      var lastWidth = root.clientWidth;
      window.addEventListener('resize', function () { if (root.clientWidth !== lastWidth) { lastWidth = root.clientWidth; render(); } });
      setInterval(loadHistory, 5 * 60 * 1000);
      load();
    }
  </script>
</body>
</html>
