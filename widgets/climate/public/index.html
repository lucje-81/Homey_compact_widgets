<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; color: var(--homey-text-color, #222);
      font-family: var(--homey-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .title { font-size: 14px; font-weight: 600; margin: 0 0 4px 2px; }
    .grid { display: grid; gap: 6px; --tile-h: 52px; --icon: 30px; --name: 13px; }
    .grid.size-S { --tile-h: 44px; --icon: 26px; --name: 12px; }
    .grid.size-L { --tile-h: 62px; --icon: 36px; --name: 14px; }
    .tile { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; min-height: var(--tile-h);
      padding: 0 8px; border-radius: 12px; background: rgba(127,127,127,.12); cursor: pointer; overflow: hidden; }
    .tile.on { background: var(--tint); }
    .tile.na { opacity: .45; }
    .tile.open { box-shadow: inset 0 0 0 2px rgba(127,127,127,.35); }
    .icon { flex: none; width: var(--icon); height: var(--icon); border-radius: 50%; display: flex; align-items: center;
      justify-content: center; background: rgba(127,127,127,.18); }
    .tile.on .icon { background: var(--accent); color: #fff; }
    .icon svg { width: 60%; height: 60%; }
    .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .name { font-size: var(--name); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .state { font-size: 11px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .big { flex: none; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .level { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); border-radius: 0 2px 2px 0; }
    .grid.narrow .tile { flex-wrap: wrap; padding: 7px 8px 8px; gap: 4px 6px; align-content: flex-start; }
    .grid.narrow .icon { width: 26px; height: 26px; }
    .grid.narrow .big { margin-left: auto; }
    .grid.narrow .txt { flex-basis: 100%; order: 3; }
    .grid.narrow .name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      line-height: 1.2; overflow-wrap: break-word; hyphens: auto; }
    .panel { grid-column: 1 / -1; background: rgba(127,127,127,.10); border-radius: 12px; padding: 8px 10px 10px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .btn { flex: 1; height: 44px; border-radius: 10px; border: none; background: rgba(127,127,127,.2); color: inherit;
      font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn:active { background: rgba(127,127,127,.38); }
    .btn svg { width: 22px; height: 22px; }
    .target { flex: 1.4; text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { padding: 7px 12px; border-radius: 16px; background: rgba(127,127,127,.18); font-size: 13px; cursor: pointer; }
    .chip.sel { background: var(--accent, #3a7bd5); color: #fff; }
    .ctl { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; }
    .ctl label { flex: none; width: 44px; font-size: 11px; opacity: .7; }
    .ctl .val { flex: none; width: 38px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
    input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 22px; border-radius: 11px; margin: 0;
      outline: none; border: 1px solid rgba(127,127,127,.35); background: linear-gradient(90deg, #555, #cfe3ff); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff;
      border: 2px solid rgba(0,0,0,.35); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .btn.label { font-size: 14px; gap: 6px; }
    .icon.pic { background: none; width: calc(var(--icon) + 8px); height: calc(var(--icon) + 8px); border-radius: 0; margin: -4px 0; }
    .tile.on .icon.pic { background: none; color: var(--accent); }
    .icon.pic svg { width: 100%; height: 100%; }
    .grid.narrow .icon.pic { width: 32px; height: 32px; }
    .btn.pwr { flex: none; width: 52px; }
    .btn.pwr.on { background: #5cbf4a; color: #fff; }
    .message { font-size: 13px; opacity: .75; padding: 8px 2px; line-height: 1.4; }
  </style>
</head>
<body class="homey-widget-small">
  <script src="icons.js"></script>
  <div id="root"></div>
  <script>
    var MIN_WIDTH = { S: 88, M: 112, L: 150 };
    var NARROW = 150;
    var SVG = function (p, cls) { return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; };
    var UI = {
      up: SVG('<path d="M6 15l6-6 6 6" stroke-width="2"/>'),
      down: SVG('<path d="M6 9l6 6 6-6" stroke-width="2"/>'),
      stop: SVG('<rect x="7" y="7" width="10" height="10" rx="1.5" stroke-width="2"/>'),
      minus: SVG('<path d="M6 12h12" stroke-width="2"/>'),
      plus: SVG('<path d="M12 6v12M6 12h12" stroke-width="2"/>'),
      power: SVG('<path d="M12 3v8M7.5 6.5a7 7 0 1 0 9 0" stroke-width="2"/>'),
      press: SVG('<circle cx="12" cy="12" r="7" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/>'),
    };
    var CI = window.CompactIcons;
    var DRAW = CI.DRAW, ICON_ORDER = CI.ICON_ORDER, GATES = CI.GATES, autoIcon = CI.autoIcon, iconSvg = CI.iconSvg;
    var state = { devices: [], settings: {}, icons: {}, open: null, ready: false, lastHeight: 0, language: undefined, hold: {}, timers: {} };

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function dev(id) { return state.devices.find(function (d) { return d.id === id; }); }
    function has(d, cap) { return d.caps && Object.prototype.hasOwnProperty.call(d.caps, cap); }
    function num(v, dec) {
      if (v === null || v === undefined || isNaN(Number(v))) return '–';
      try { return Number(v).toLocaleString(state.language || undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
      catch (e) { return Number(v).toFixed(dec); }
    }
    function tempText(v) { return num(v, 1) + '°'; }
    function decimalsOf(step) { return String(step).indexOf('.') >= 0 ? String(step).split('.')[1].length : 0; }

    function iconOf(d) { return state.icons[d.id] || autoIcon(d); }

    // Opening fraction 0..1, or null when unknown
    function openness(d) {
      var c = d.caps;
      if (has(d, 'garagedoor_closed') && c.garagedoor_closed != null) return c.garagedoor_closed ? 0 : 1;
      if (has(d, 'windowcoverings_set') && c.windowcoverings_set != null) return Number(c.windowcoverings_set);
      if (has(d, 'alarm_contact') && c.alarm_contact != null) return c.alarm_contact ? 1 : 0;
      if (GATES.indexOf(iconOf(d)) >= 0 && has(d, 'onoff') && c.onoff != null) return c.onoff ? 1 : 0;
      return null;
    }

    function kind(d) {
      if (d.missing) return 'missing';
      if (has(d, 'target_temperature')) return 'thermostat';
      if (has(d, 'garagedoor_closed') || has(d, 'button') || has(d, 'windowcoverings_set') || has(d, 'windowcoverings_state') || has(d, 'alarm_contact')) return 'cover';
      if (has(d, 'onoff')) return GATES.indexOf(iconOf(d)) >= 0 ? 'cover' : 'switch';
      return 'other';
    }


    function columns(n) {
      var s = state.settings;
      if (s.columns && s.columns !== 'auto') return Math.min(Number(s.columns), Math.max(1, n));
      var width = document.getElementById('root').clientWidth || window.innerWidth;
      return Math.max(1, Math.min(Math.floor((width + 6) / ((MIN_WIDTH[s.size] || MIN_WIDTH.M) + 6)), n, 4));
    }

    function tileHtml(d) {
      var k = kind(d);
      var c = d.caps;
      var icon = iconOf(d);
      var isGate = GATES.indexOf(icon) >= 0;
      var cls = 'tile';
      var accent = '#888';
      var tint = 'rgba(127,127,127,.12)';
      var stateText = '';
      var big = '';
      var level = null;
      var p = openness(d);
      if (k === 'thermostat') {
        var cur = has(d, 'measure_temperature') ? Number(c.measure_temperature) : null;
        var tgt = Number(c.target_temperature);
        big = has(d, 'measure_temperature') ? tempText(cur) : tempText(tgt);
        stateText = Homey.__('target') + ' ' + tempText(tgt);
        if (has(d, 'thermostat_mode') && c.thermostat_mode) {
          var m = ((d.options && d.options.thermostat_mode) || []).find(function (x) { return x.id === c.thermostat_mode; });
          stateText += ' · ' + (m ? m.title : c.thermostat_mode);
        }
        var thermoOff = has(d, 'onoff') && c.onoff === false;
        if (thermoOff) stateText = Homey.__('off') + (has(d, 'thermostat_mode') && c.thermostat_mode ? stateText.slice(stateText.indexOf(' · ')) : '');
        // no heating colour while switched off
        if (!thermoOff && cur !== null && !isNaN(cur) && tgt > cur + 0.3) { cls += ' on'; accent = '#e8702a'; tint = 'rgba(232,112,42,.2)'; }
        else if (!thermoOff && c.thermostat_mode === 'cool' && cur !== null && !isNaN(cur) && tgt < cur - 0.3) { cls += ' on'; accent = '#3a7bd5'; tint = 'rgba(58,123,213,.2)'; }
      } else if (k === 'cover') {
        if (p !== null) {
          if (has(d, 'windowcoverings_set')) level = p;
          stateText = p <= 0.01 ? Homey.__('closed') : p >= 0.99 ? Homey.__('open') : Homey.__('open') + ' ' + Math.round(p * 100) + ' %';
          if (p > 0.01) {
            cls += ' on';
            if (isGate) { accent = '#d98a1c'; tint = 'rgba(217,138,28,.2)'; } else { accent = '#3a7bd5'; tint = 'rgba(58,123,213,.16)'; }
          }
        }
        if (has(d, 'windowcoverings_state') && c.windowcoverings_state && c.windowcoverings_state !== 'idle') {
          stateText = Homey.__(c.windowcoverings_state === 'up' ? (isGate ? 'opening' : 'goingUp') : (isGate ? 'closing' : 'goingDown'));
        }
        if (!stateText) stateText = '–';
      } else if (k === 'switch') {
        if (c.onoff === true) { cls += ' on'; accent = '#5cbf4a'; tint = 'rgba(92,191,74,.2)'; }
        stateText = Homey.__(c.onoff ? 'on' : 'off');
      } else {
        stateText = Homey.__('notSupported');
        cls += ' na';
      }
      if (d.available === false) { cls += ' na'; stateText = Homey.__('unavailable'); }
      if (state.open === d.id) cls += ' open';
      return '<div class="' + cls + '" data-id="' + esc(d.id) + '" style="--accent:' + accent + ';--tint:' + tint + '">'
        + '<span class="icon' + (icon === 'thermostat' || icon === 'power' ? '' : ' pic') + '">' + iconSvg(icon, p) + '</span>'
        + (big ? '<span class="big">' + esc(big) + '</span>' : '')
        + '<span class="txt"><span class="name">' + esc(d.name) + '</span><span class="state">' + esc(stateText) + '</span></span>'
        + (level !== null && level > 0.01 ? '<span class="level" style="width:' + (level * 100).toFixed(1) + '%"></span>' : '')
        + '</div>';
    }

    function button(id, act, content, extra) {
      return '<button class="btn' + (extra || '') + '" data-act="' + act + '" data-id="' + esc(id) + '">' + content + '</button>';
    }

    function panelHtml(d) {
      var k = kind(d);
      var c = d.caps;
      var id = d.id;
      var isGate = GATES.indexOf(iconOf(d)) >= 0;
      var html = '<div class="panel" data-panel="' + esc(id) + '">';
      if (k === 'thermostat') {
        var o = (d.options && d.options.target_temperature) || { step: 0.5 };
        html += '<div class="row">' + (has(d, 'onoff') ? button(id, 'power', UI.power, ' pwr' + (c.onoff ? ' on' : '')) : '') + button(id, 'minus', UI.minus)
          + '<span class="target" data-target="' + esc(id) + '">' + num(c.target_temperature, decimalsOf(o.step)) + ' ' + esc(o.units || '°C') + '</span>'
          + button(id, 'plus', UI.plus) + '</div>';
        var modes = (d.options && d.options.thermostat_mode) || [];
        if (has(d, 'thermostat_mode') && modes.length) {
          html += '<div class="chips">' + modes.map(function (m) {
            return '<span class="chip' + (m.id === c.thermostat_mode ? ' sel' : '') + '" data-act="mode" data-id="' + esc(id) + '" data-mode="' + esc(m.id) + '">' + esc(m.title) + '</span>';
          }).join('') + '</div>';
        }
      } else if (k === 'cover') {
        var row = '';
        if (has(d, 'garagedoor_closed')) {
          row = button(id, 'gopen', UI.up + esc(Homey.__('doOpen')), ' label') + button(id, 'gclose', UI.down + esc(Homey.__('doClose')), ' label');
        } else if (has(d, 'windowcoverings_state') || has(d, 'windowcoverings_set')) {
          row = button(id, 'up', UI.up) + (has(d, 'windowcoverings_state') ? button(id, 'stop', UI.stop) : '') + button(id, 'down', UI.down);
        } else if (has(d, 'onoff')) {
          row = button(id, 'on', esc(Homey.__(isGate ? 'doOpen' : 'on')), ' label') + button(id, 'off', esc(Homey.__(isGate ? 'doClose' : 'off')), ' label');
        }
        if (has(d, 'button')) row += button(id, 'press', UI.press + esc(Homey.__('operate')), ' label');
        if (row) html += '<div class="row">' + row + '</div>';
        if (has(d, 'windowcoverings_set')) {
          var pos = Number(c.windowcoverings_set) || 0;
          html += '<div class="ctl"><label>' + esc(Homey.__('position')) + '</label><input type="range" min="0" max="100" step="1" value="'
            + Math.round(pos * 100) + '" data-id="' + esc(id) + '"><span class="val">' + Math.round(pos * 100) + ' %</span></div>';
        }
      }
      return html + '</div>';
    }

    function render() {
      var root = document.getElementById('root');
      if (!state.devices.length) {
        root.innerHTML = '<div class="message">' + esc(Homey.__('chooseClimate')) + '</div>';
        return finish();
      }
      var cols = columns(state.devices.length);
      var width = root.clientWidth || window.innerWidth;
      var narrow = (width - 6 * (cols - 1)) / cols < NARROW;
      var html = state.settings.title ? '<div class="title">' + esc(state.settings.title) + '</div>' : '';
      html += '<div class="grid size-' + (state.settings.size || 'M') + (narrow ? ' narrow' : '') + '" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">';
      var openIdx = state.devices.findIndex(function (x) { return x.id === state.open; });
      state.devices.forEach(function (d, i) {
        html += tileHtml(d);
        var endOfRow = (i % cols === cols - 1) || i === state.devices.length - 1;
        if (endOfRow && openIdx >= i - (i % cols) && openIdx <= i) html += panelHtml(state.devices[openIdx]);
      });
      root.innerHTML = html + '</div>';
      finish();
    }

    function finish() {
      var height = Math.ceil(document.body.scrollHeight);
      if (!state.ready) { state.ready = true; state.lastHeight = height; Homey.ready({ height: height }); }
      else if (Math.abs(height - state.lastHeight) > 1) { state.lastHeight = height; Homey.setHeight(height); }
    }

    function send(id, cap, value) {
      state.hold[id + '|' + cap] = Date.now() + 2000;
      return Homey.api('POST', '/set', { deviceId: id, capability: cap, value: value }).catch(function (err) {
        state.hold[id + '|' + cap] = 0;
        console.error(err);
        load();
      });
    }
    function setLocal(d, cap, value) { d.caps[cap] = value; send(d.id, cap, value); render(); }

    // Thermostat: change locally at once, send once the user stops tapping
    function stepTarget(d, dir) {
      var o = (d.options && d.options.target_temperature) || { min: 5, max: 30, step: 0.5 };
      var v = Number(d.caps.target_temperature) || o.min;
      v = Math.round((v + dir * o.step) / o.step) * o.step;
      v = Math.max(o.min, Math.min(o.max, Number(v.toFixed(3))));
      d.caps.target_temperature = v;
      state.hold[d.id + '|target_temperature'] = Date.now() + 3000;
      var el = document.querySelector('[data-target="' + CSS.escape(d.id) + '"]');
      if (el) el.textContent = num(v, decimalsOf(o.step)) + ' ' + (o.units || '°C');
      var tile = document.querySelector('.tile[data-id="' + CSS.escape(d.id) + '"]');
      if (tile) tile.outerHTML = tileHtml(d);
      clearTimeout(state.timers[d.id]);
      state.timers[d.id] = setTimeout(function () { send(d.id, 'target_temperature', v); }, 700);
    }

    function act(d, a, el) {
      switch (a) {
        case 'plus': return stepTarget(d, 1);
        case 'minus': return stepTarget(d, -1);
        case 'mode': return setLocal(d, 'thermostat_mode', el.getAttribute('data-mode'));
        case 'gopen': return setLocal(d, 'garagedoor_closed', false);
        case 'gclose': return setLocal(d, 'garagedoor_closed', true);
        case 'power': return setLocal(d, 'onoff', !d.caps.onoff);
        case 'on': return setLocal(d, 'onoff', true);
        case 'off': return setLocal(d, 'onoff', false);
        case 'press':
          el.style.opacity = '.5';
          setTimeout(function () { el.style.opacity = ''; }, 600);
          return send(d.id, 'button', true);
        case 'stop': return send(d.id, 'windowcoverings_state', 'idle');
        case 'up': case 'down':
          if (has(d, 'windowcoverings_state')) return setLocal(d, 'windowcoverings_state', a);
          return setLocal(d, 'windowcoverings_set', a === 'up' ? 1 : 0);
        default: return null;
      }
    }

    function togglePanel(d) {
      state.open = state.open === d.id ? null : d.id;
      render();
    }

    function onClick(e) {
      var el = e.target.closest('[data-act]');
      if (el) return act(dev(el.getAttribute('data-id')), el.getAttribute('data-act'), el);
      var tile = e.target.closest('.tile');
      if (!tile) return;
      var t = dev(tile.getAttribute('data-id'));
      if (!t || t.missing) return;
      if (kind(t) === 'switch' && t.available !== false) return setLocal(t, 'onoff', !t.caps.onoff);
      togglePanel(t);
    }

    function onSlide(e, final) {
      if (e.target.type !== 'range') return;
      var d = dev(e.target.getAttribute('data-id'));
      var v = Number(e.target.value) / 100;
      e.target.nextSibling.textContent = Math.round(v * 100) + ' %';
      d.caps.windowcoverings_set = v;
      state.hold[d.id + '|windowcoverings_set'] = Date.now() + 3000;
      if (final) { send(d.id, 'windowcoverings_set', v); render(); }
    }

    function onValues(batch) {
      var dirty = false;
      Object.keys(batch).forEach(function (k) {
        var i = k.indexOf('|');
        var d = dev(k.slice(0, i));
        var cap = k.slice(i + 1);
        if (!d || !has(d, cap)) return;
        if (state.hold[k] && state.hold[k] > Date.now()) return;
        d.caps[cap] = batch[k];
        dirty = true;
      });
      var dragging = document.activeElement && document.activeElement.type === 'range';
      if (dirty && !dragging) render();
    }

    function load() {
      var ids = Homey.getDeviceIds ? Homey.getDeviceIds() : [];
      if (!ids || !ids.length) { state.devices = []; return render(); }
      return Homey.api('GET', '/state?ids=' + encodeURIComponent(ids.join(',')))
        .then(function (data) {
          state.devices = (data && data.devices) || [];
          state.icons = (data && data.icons) || {};
          state.language = data && data.language;
          if (state.language) document.documentElement.lang = state.language;
          render();
        })
        .catch(function (err) {
          document.getElementById('root').innerHTML = '<div class="message">' + esc(err && err.message ? err.message : err) + '</div>';
          finish();
        });
    }

    function onHomeyReady(Homey) {
      state.settings = Homey.getSettings() || {};
      var root = document.getElementById('root');
      root.addEventListener('click', onClick);
      root.addEventListener('input', function (e) { onSlide(e, false); });
      root.addEventListener('change', function (e) { onSlide(e, true); });
      Homey.on('values', onValues);
      Homey.on('icons', function (icons) { state.icons = icons || {}; render(); });
      var lastWidth = root.clientWidth;
      window.addEventListener('resize', function () { if (root.clientWidth !== lastWidth) { lastWidth = root.clientWidth; render(); } });
      load();
    }
  </script>
</body>
</html>
